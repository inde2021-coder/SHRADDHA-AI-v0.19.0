name: Android build and tests

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

on:
  push:
    branches:
      - main
      - feature/shraddha-multilingual-voice-pawari
      - audit-fixes-v0.19.1
      - redesign-v0.19.2
      - 'optimization/**'
  pull_request:
    branches:
      - redesign-v0.19.2
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, unit tests and debug APK
    # Hosted runners may not expose KVM. Explicitly permit QEMU TCG when the action disables hardware acceleration.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check backend JavaScript syntax
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate backend source
        run: node --check backend/server.js && node --check backend/form-autofill.js

      - name: Test specialized Visual Lens modes
        run: node --test backend/vision-analysis.test.js

      - name: Test AI form image extraction and field safety
        run: node --test backend/form-autofill.test.js

      - name: Test authorized social publishing policy
        run: node --test backend/social-publishing.test.js

      - name: Test mandatory task plan approval policy
        run: node --test backend/plan-safety.test.js

      - name: Test automatic AI provider routing
        run: node --test backend/provider-routing.test.js

      - name: Test backend relay consent policy
        run: node --test backend/relay-policy.test.js

      - name: Test shared file integrity envelope
        run: node --test backend/relay-file-validation.test.js

      - name: Test Firebase Firestore and Storage security rules
        run: |
          git config --global init.defaultBranch main
          npm install --prefix firebase/rules-tests --no-audit --no-fund
          ./firebase/rules-tests/node_modules/.bin/firebase emulators:exec --project demo-shraddha-ai --only firestore,storage,database "npm --prefix firebase/rules-tests test"

      - name: Test Gemini Live token request
        run: node --test backend/gemini-live-token.test.js

      - name: Test custom Shraddha voice gateway
        run: node --test backend/voice-synthesis.test.js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate custom voice engine Python syntax
        run: python -m py_compile voice-engine/app.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Print failed JVM unit test details
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for report in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
            echo "===== $report ====="
            cat "$report"
          done

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build optimized arm64 release APK and verify bundled model removal
        shell: bash
        run: |
          ./gradlew :app:assembleRelease -PshraddhaAbi=arm64-v8a --stacktrace
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "Optimized release APK: $apk"
          apk_bytes="$(stat -c%s "$apk")"
          apk_mib="$(awk -v bytes="$apk_bytes" 'BEGIN {printf "%.2f", bytes / 1048576}')"
          echo "Release APK size: ${apk_mib} MiB (${apk_bytes} bytes)"
          {
            echo "### Optimized Android release APK"
            echo ""
            echo "- File: $(basename "$apk")"
            echo "- Size: **${apk_mib} MiB** (${apk_bytes} bytes)"
            echo "- ABI: arm64-v8a"
            echo "- R8 minification and resource shrinking: enabled"
            echo "- Bundled biometric ONNX models: prohibited"
            echo ""
            echo "This measured size is the baseline for setting a data-backed size budget; no arbitrary limit is applied before the first verified artifact measurement."
          } >> "$GITHUB_STEP_SUMMARY"
          if unzip -Z1 "$apk" | grep -F 'assets/biometric-models/' | grep -F '.onnx'; then
            echo "ERROR: ONNX biometric models are still bundled in the release APK."
            exit 1
          fi
          abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" {print $2}' | sort -u | paste -sd ' ' -)"
          echo "Native ABIs in release APK: $abis"
          test "$abis" = "arm64-v8a"
      - name: Upload optimized arm64 release APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-arm64-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Run the x86_64 guest on the Ubuntu KVM runner with adequate RAM/CPU.
      # Keep SwiftShader for headless Linux; wait-for-android-emulator.sh verifies the actual ADB serial.
      - name: Explicitly install Android Emulator and API 30 x86_64 system image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          set +e
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then
            echo "::error::sdkmanager license acceptance failed with exit code $license_status"
            exit "$license_status"
          fi
          "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-30;default;x86_64"
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Run biometric ONNX smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          emulator-boot-timeout: 1800
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          pre-emulator-launch-script: adb start-server
          script: bash .github/scripts/android-onnx-smoke.sh
      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-instrumentation-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  windows-companion:
    name: Windows PC companion native checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Windows companion dependencies
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m pip install -r requirements.txt

      - name: Run Windows companion policy tests
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m unittest -v

      - name: Compile Windows companion
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m py_compile shraddha_pc_companion.py
