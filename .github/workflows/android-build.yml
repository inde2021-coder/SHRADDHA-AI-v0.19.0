name: Android build and tests

on:
  push:
    branches:
      - main
      - audit-fixes-v0.19.1
      - redesign-v0.19.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check backend JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate backend source
        run: node --check backend/server.js

      - name: Test specialized Visual Lens modes
        run: node --test backend/vision-analysis.test.js

      - name: Test authorized social publishing policy
        run: node --test backend/social-publishing.test.js

      - name: Test mandatory task plan approval policy
        run: node --test backend/plan-safety.test.js

      - name: Test automatic AI provider routing
        run: node --test backend/provider-routing.test.js

      - name: Test backend relay consent policy
        run: node --test backend/relay-policy.test.js

      - name: Test Firebase Firestore and Storage security rules
        run: |
          npm install --prefix firebase/rules-tests --no-audit --no-fund
          ./firebase/rules-tests/node_modules/.bin/firebase emulators:exec --project demo-shraddha-ai --only firestore,storage "npm --prefix firebase/rules-tests test"

      - name: Test Gemini Live token request
        run: node --test backend/gemini-live-token.test.js

      - name: Test custom Shraddha voice gateway
        run: node --test backend/voice-synthesis.test.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Windows PC companion safety policy
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m unittest -v

      - name: Validate custom voice engine Python syntax
        run: python -m py_compile voice-engine/app.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Use a lightweight, stable API 34 image and explicit software rendering.
      # The previous Pixel 6 / API 35 runner stayed offline until its boot timeout,
      # even though unit tests and APK compilation had already passed.
      - name: Run biometric ONNX smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096 -cores 2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shraddha-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  windows-companion:
    name: Windows PC companion native checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Windows companion dependencies
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m pip install -r requirements.txt

      - name: Run Windows companion policy tests
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m unittest -v

      - name: Compile Windows companion
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m py_compile shraddha_pc_companion.py
