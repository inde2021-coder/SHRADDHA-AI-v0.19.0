name: Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shraddha-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Validate and install signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          chmod +x ./gradlew
      - name: Run tests and release lint
        run: ./gradlew testDebugUnitTest lintRelease
      - name: Build signed APK and AAB
        run: ./gradlew assembleRelease bundleRelease
      - name: Verify release outputs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -s app/build/outputs/bundle/release/app-release.aab
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/
          cp app/build/outputs/bundle/release/app-release.aab release-artifacts/
          cd release-artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - name: Publish signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shraddha-ai-signed-release
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
