name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: "Publish the validated AAB to Google Play (requires Play service-account secret)"
        required: true
        type: boolean
        default: false
      play_track:
        description: "Google Play track"
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21 (match the validated Android CI toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate and install signing key
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/shraddha-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"

          # Remove only trailing CR/LF characters from copied text secrets.
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            value="${!name}"
            value="${value%%$'\\r'}"
            value="${value%%$'\\n'}"
            printf -v "$name" '%s' "$value"
            export "$name"
            if [[ -z "$value" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

          echo "Detecting keystore format and validating alias (credential values are never printed)..."
          store_type=""
          for candidate in PKCS12 JKS; do
            if keytool -list -storetype "$candidate" -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              store_type="$candidate"
              break
            fi
          done

          if [[ -z "$store_type" ]]; then
            echo "::error::Keystore could not be opened using PKCS12 or JKS. No credential values were printed."
            echo "Decoded keystore size: $(wc -c < "$ANDROID_KEYSTORE_PATH") bytes"
            echo "File identification:"
            file "$ANDROID_KEYSTORE_PATH" || true
            printf 'First 8 bytes (hex only): '
            od -An -tx1 -N8 "$ANDROID_KEYSTORE_PATH" | tr -d '\\n'
            printf '\\n'
            echo "Base64 payload length (whitespace removed): $(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | wc -c)"
            echo "This distinguishes an invalid/wrong file payload from a password issue without exposing the key or any credential."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_TYPE=$store_type" >> "$GITHUB_ENV"
          echo "Detected keystore format: $store_type"
          echo "Checking private-key password..."
          if ! keytool -certreq -storetype "$store_type" -alias "$ANDROID_KEY_ALIAS" -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -file "$RUNNER_TEMP/signing-key-check.csr" >/dev/null 2>&1; then
            echo "::error::Private-key password validation failed for the selected alias."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing-key-check.csr"
          echo "Signing keystore, alias, and private-key password validated."
          chmod +x ./gradlew

      - name: Validate Google Play publishing configuration
        if: ${{ inputs.publish_to_play }}
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Google Play publishing is allowed only from main."
            exit 1
          fi
          if [[ -z "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Missing PLAY_STORE_SERVICE_ACCOUNT_JSON GitHub Actions secret."
            exit 1
          fi
          printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("type") == "service_account"; assert d.get("client_email"); assert d.get("private_key")'

      - name: Run unit tests and release lint
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease --stacktrace

      - name: Build signed APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signatures, package identity, and outputs
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -n "$apk"
          test -s "$aab"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify -verbose -certs "$aab"
          unzip -p "$aab" base/manifest/AndroidManifest.xml >/dev/null
          mkdir -p release-artifacts
          cp "$apk" release-artifacts/
          cp "$aab" release-artifacts/
          cd release-artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt
          cd ..
          {
            echo "### Signed Android release verification"
            echo "- APK signature: verified by apksigner"
            echo "- AAB signature: verified by jarsigner"
            echo "- SHA-256 checksums: generated"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK, AAB and checksums
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-signed-release
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish AAB to Google Play
        if: ${{ inputs.publish_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: in.shraddha.ai
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
