name: Shraddha multilingual voice data validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/pawari_dataset_validator.py"
      - "tests/test_pawari_dataset_validator.py"
      - "docs/curriculum/PAWARI-*.csv"
      - ".github/workflows/multilingual-voice-validation.yml"
  push:
    branches: [feature/shraddha-multilingual-voice-pawari]
    paths:
      - "tools/pawari_dataset_validator.py"
      - "tests/test_pawari_dataset_validator.py"
      - "docs/curriculum/PAWARI-*.csv"
      - ".github/workflows/multilingual-voice-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pawari-data-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile tools/pawari_dataset_validator.py
      - name: Run Pawari consent and metadata tests
        run: python -m unittest discover -s tests -p "test_pawari_dataset_validator.py" -v
