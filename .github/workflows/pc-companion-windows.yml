name: Windows PC Companion

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
on:
  workflow_dispatch:
  push:
    branches: [work/step-01-source-audit-fixes, optimization/apk-size-without-feature-loss]
    paths:
      - "pc_companion/**"
      - "desktop-companion/shraddha-pc-companion/**"
      - ".github/workflows/pc-companion-windows.yml"
jobs:
  build-windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r pc_companion/requirements.txt
      - name: Run protocol and action tests
        run: python -m unittest discover -s pc_companion/tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ShraddhaAI-PC-Companion --collect-all keyring --collect-all cryptography pc_companion/agent.py
      - uses: actions/upload-artifact@v6
        with:
          name: ShraddhaAI-PC-Companion-Windows
          path: dist/ShraddhaAI-PC-Companion.exe
          if-no-files-found: error
          retention-days: 14

  advanced-desktop-companion:
    name: Advanced Windows companion tests and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install advanced companion dependencies
        run: python -m pip install -r desktop-companion/shraddha-pc-companion/requirements.txt pyinstaller
      - name: Run advanced companion policy and protocol tests
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Build advanced desktop companion executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name ShraddhaAI-Desktop-Companion --collect-all cryptography desktop-companion/shraddha-pc-companion/shraddha_pc_companion.py
      - uses: actions/upload-artifact@v6
        with:
          name: ShraddhaAI-Desktop-Companion-Windows
          path: dist/ShraddhaAI-Desktop-Companion.exe
          if-no-files-found: error
          retention-days: 14
