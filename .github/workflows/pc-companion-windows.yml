name: Shraddha Windows Desktop Companion

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
on:
  workflow_dispatch:
  push:
    branches: [work/step-01-source-audit-fixes, optimization/apk-size-without-feature-loss]
    paths:
      - "desktop-companion/shraddha-pc-companion/**"
      - ".github/workflows/pc-companion-windows.yml"
jobs:
  advanced-desktop-companion:
    name: Advanced Windows companion tests and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install advanced companion dependencies
        run: python -m pip install -r desktop-companion/shraddha-pc-companion/requirements-all.txt pyinstaller
      - name: Run advanced companion policy and protocol tests
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Build advanced desktop companion executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name ShraddhaAI-Desktop-Companion --collect-all keyring --collect-all cryptography --hidden-import pyautogui --hidden-import pygetwindow --hidden-import pywinauto --hidden-import mss --hidden-import PIL --hidden-import pytesseract --hidden-import pyperclip --hidden-import sounddevice --hidden-import vosk --hidden-import cv2 --hidden-import numpy --hidden-import screen_brightness_control desktop-companion/shraddha-pc-companion/shraddha_pc_companion.py
      - uses: actions/upload-artifact@v6
        with:
          name: ShraddhaAI-Desktop-Companion-Windows
          path: dist/ShraddhaAI-Desktop-Companion.exe
          if-no-files-found: error
          retention-days: 14
