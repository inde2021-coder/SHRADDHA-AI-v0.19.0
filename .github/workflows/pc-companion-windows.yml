name: Shraddha Windows PC Companion

# Intentionally manual: the user requested one combined validation pass after
# implementation is complete. Do not start Windows tests on every code commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc-companion:
    name: Build Shraddha Windows PC Companion
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pc_companion/requirements.txt
      - name: Install companion dependencies
        run: python -m pip install -r pc_companion/requirements.txt
      - name: Build Windows executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ShraddhaAI-PC-Companion
          --collect-all keyring
          --collect-all cryptography
          --hidden-import pyautogui
          --hidden-import pygetwindow
          --hidden-import pywinauto
          --hidden-import mss
          --hidden-import PIL
          --hidden-import pytesseract
          --hidden-import pyperclip
          pc_companion/agent.py
      - uses: actions/upload-artifact@v6
        with:
          name: ShraddhaAI-PC-Companion-Windows
          path: dist/ShraddhaAI-PC-Companion.exe
          if-no-files-found: error
          retention-days: 14
