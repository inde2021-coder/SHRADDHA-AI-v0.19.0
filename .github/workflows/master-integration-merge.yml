name: Master integration merge and verification

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

on:
  push:
    branches:
      - integration/master-feature-consolidation-2026-11
  pull_request:
    branches:
      - integration/master-feature-consolidation-2026-11
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-integration-merge
  cancel-in-progress: false

jobs:
  merge-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          ref: integration/master-feature-consolidation-2026-11
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch every source branch
        run: git fetch origin --prune

      - name: Merge every project branch into one integration branch
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            main \
            audit-fixes-v0.19.1 \
            feature/ai-phone-agent-foundation \
            integration/branch-hardening-2026-11 \
            integration/firebase-rtdb-rules-tested \
            integration/redesign-phone-agent-2026-11 \
            redesign-v0.19.2 \
            work/step-01-source-audit-fixes
          do
            echo "::group::Merge origin/$branch"
            git merge --no-edit --no-ff "origin/$branch" || {
              git status --short
              echo "Merge failed for $branch; stopping before tests."
              exit 1
            }
            echo "::endgroup::"
          done

      - name: Validate backend JavaScript
        run: |
          node --version
          node --check backend/server.js
          node --check backend/telephony-audio.js

      - name: Run backend tests
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Run Firebase security rules tests
        run: |
          git config --global init.defaultBranch main
          npm install --prefix firebase/rules-tests --no-audit --no-fund
          ./firebase/rules-tests/node_modules/.bin/firebase emulators:exec --project demo-shraddha-ai --only firestore,storage,database "npm --prefix firebase/rules-tests test"

      - name: Run Windows companion policy tests
        working-directory: desktop-companion/shraddha-pc-companion
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v

      - name: Run Android unit tests and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Push consolidated branch only after all verification steps pass
        run: git push origin HEAD:integration/master-feature-consolidation-2026-11

      - name: Upload consolidated debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-master-integration-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
