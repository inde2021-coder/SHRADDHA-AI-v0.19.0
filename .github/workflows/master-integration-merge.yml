name: Integration branch consolidation and full verification

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-full-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-and-test:
    runs-on: ubuntu-24.04
    # Hosted runners may not expose KVM. Explicitly permit QEMU TCG when the action disables hardware acceleration.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    timeout-minutes: 120
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch every source branch
        run: git fetch origin --prune

      - name: Verify every source branch is already included in this commit
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            main \
            feature/complete-pending-shraddha-features \
            audit-fixes-v0.19.1 \
            feature/ai-phone-agent-foundation \
            feature/complete-remaining-shraddha-features \
            fix/android-emulator-stability-2026-11 \
            fix/android-onnx-df-diagnostic-2026-11 \
            integration/branch-hardening-2026-11 \
            integration/firebase-rtdb-rules-tested \
            integration/redesign-phone-agent-2026-11 \
            integration/master-feature-consolidation-2026-11 \
            optimization/apk-size-without-feature-loss \
            redesign/shraddha-ai-neon-glass-home \
            redesign-v0.19.2 \
            work/step-01-source-audit-fixes
          do
            if ! git merge-base --is-ancestor "origin/$branch" HEAD; then
              echo "::error::Source branch $branch is not fully merged into the current integration commit."
              echo "Merge $branch into integration and push before running the full suite."
              exit 1
            fi
            echo "Verified: $branch is included in $(git rev-parse --short HEAD)"
          done

      - name: Check integrated diff for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff_base="origin/$GITHUB_BASE_REF"
          else
            diff_base="$(git rev-parse HEAD^)"
          fi
          git diff --check "$diff_base...HEAD"

      - name: Validate backend JavaScript
        run: |
          node --version
          node --check backend/server.js
          node --check backend/telephony-audio.js
          node --check backend/form-autofill.js

      - name: Run backend tests
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Set up Python 3.12 for voice-engine validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate custom voice engine Python syntax
        run: python -m py_compile voice-engine/app.py

      - name: Run Firebase security rules tests
        run: |
          git config --global init.defaultBranch main
          npm install --prefix firebase/rules-tests --no-audit --no-fund
          ./firebase/rules-tests/node_modules/.bin/firebase emulators:exec --project demo-shraddha-ai --only firestore,storage,database "npm --prefix firebase/rules-tests test"

      - name: Run Windows companion policy tests
        working-directory: desktop-companion/shraddha-pc-companion
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android unit tests and build debug APK
        timeout-minutes: 50
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --max-workers=2 :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Build optimized arm64 release APK and verify packaged assets
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --max-workers=2 :app:assembleRelease -PshraddhaAbi=arm64-v8a --stacktrace
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          apk_bytes="$(stat -c%s "$apk")"
          apk_mib="$(awk -v bytes="$apk_bytes" 'BEGIN {printf "%.2f", bytes / 1048576}')"
          echo "Optimized arm64 release APK: $(basename "$apk") (${apk_mib} MiB, ${apk_bytes} bytes)"
          if unzip -Z1 "$apk" | grep -F 'assets/biometric-models/' | grep -F '.onnx'; then
            echo "ERROR: biometric ONNX models must not be bundled in the optimized release APK."
            exit 1
          fi
          abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" {print $2}' | sort -u | paste -sd ' ' -)"
          test "$abis" = "arm64-v8a"
      - name: Upload optimized arm64 release APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-arm64-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explicitly install Android Emulator and API 30 x86_64 system image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          set +e
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then
            echo "::error::sdkmanager license acceptance failed with exit code $license_status"
            exit "$license_status"
          fi
          "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-30;default;x86_64"
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Run Android emulator instrumentation, ONNX and app launch checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          emulator-boot-timeout: 1800
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          # Use a lean API 30 x86_64 image with bounded guest resources; API 30 is within the app's minSdk/target compatibility range.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          pre-emulator-launch-script: adb start-server
          script: bash .github/scripts/android-onnx-smoke.sh

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-android-instrumentation-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Upload consolidated debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-master-integration-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
  pc-companion-windows:
    name: Windows Shraddha desktop companion tests and EXE package
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install desktop companion dependencies and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop-companion/shraddha-pc-companion/requirements.txt pyinstaller

      - name: Run desktop companion policy and protocol tests
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Compile desktop companion entry point
        working-directory: desktop-companion/shraddha-pc-companion
        run: python -m py_compile shraddha_pc_companion.py

      - name: Build Windows desktop companion executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ShraddhaAI-Desktop-Companion --collect-all keyring --collect-all cryptography desktop-companion/shraddha-pc-companion/shraddha_pc_companion.py

      - name: Upload Windows desktop companion executable
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-desktop-companion-windows-exe
          path: dist/ShraddhaAI-Desktop-Companion.exe
          if-no-files-found: error
          retention-days: 14
