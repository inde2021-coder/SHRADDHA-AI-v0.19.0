name: Android CI

on:
  push:
    branches: ["main", "work/**"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

# Keep the newest run per event/branch (or PR number). Push and pull_request runs
# must not cancel one another while GitHub reports the same commit on both events.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Verify device-specific APKs and generate checksums
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/debug
          test -s app-arm64-v8a-debug.apk
          test -s app-armeabi-v7a-debug.apk
          unzip -l app-arm64-v8a-debug.apk | grep -q 'lib/arm64-v8a/'
          unzip -l app-armeabi-v7a-debug.apk | grep -q 'lib/armeabi-v7a/'
          if unzip -l app-arm64-v8a-debug.apk | grep -Eq 'lib/(x86|x86_64)/'; then exit 1; fi
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish device-specific debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shraddha-ai-debug-apks-arm
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install relay dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check relay JavaScript syntax
        working-directory: backend
        run: npm run check
      - name: Run relay security and API tests
        working-directory: backend
        run: npm test
