name: Android CI

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

on:
  pull_request:
    branches:
      - main
      - integration/master-feature-consolidation-2026-11
  push:
    branches:
      - main
      - integration/master-feature-consolidation-2026-11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests, APK build and emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate backend JavaScript syntax
        run: node --check backend/server.js

      - name: Run Android unit tests and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Boot Android emulator, install APK and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p in.shraddha.ai 1
            sleep 15
            adb shell pidof in.shraddha.ai
            adb shell dumpsys activity activities | grep -E "mResumedActivity|ResumedActivity"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
