name: Android CI

on:
  push:
    branches: ["main", "work/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Keep only the newest verification run for a branch. This avoids duplicate Gradle
# dependency downloads on every small commit and prevents Maven Central rate limiting.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shraddha-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install relay dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check relay JavaScript syntax
        working-directory: backend
        run: npm run check
