name: Android CI

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

on:
  # Run only when the owner explicitly starts the consolidated verification.
  # Do not auto-run repeatedly while source fixes are still being committed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android unit tests, APK build and emulator smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate backend JavaScript syntax
        run: node --check backend/server.js

      - name: Run Android unit tests and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Boot Android emulator, install APK and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          emulator-boot-timeout: 1200
          target: default
          arch: x86_64
          profile: pixel_2
          # Avoid the action's post-boot settings-service calls; they caused Broken pipe (32) on TCG.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2 -partition-size 4096
          pre-emulator-launch-script: adb start-server
          script: bash .github/scripts/android-ci-smoke.sh

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
