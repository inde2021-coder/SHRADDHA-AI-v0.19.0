name: Branch CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - redesign-v0.19.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax and available unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend syntax
        working-directory: backend
        run: npm run check
      - name: Run backend unit tests when configured
        working-directory: backend
        run: npm test --if-present

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Kotlin unit tests and assemble debug APK
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: shraddha-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
