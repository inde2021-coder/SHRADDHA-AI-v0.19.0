name: Live App Operator Android Validation

on:
  push:
    branches:
      - fix/live-app-operator-glass-ui-and-actions
    paths:
      - "app/src/main/java/in/shraddha/ai/operator/**"
      - "app/src/main/java/in/shraddha/ai/phone/**"
      - "app/src/main/java/com/Lia/assistant/ui/fx/NovaOrb.kt"
      - ".github/workflows/live-operator-android.yml"
  pull_request:
    branches:
      - feature/shraddha-home-screen-polish
    paths:
      - "app/src/main/java/in/shraddha/ai/operator/**"
      - "app/src/test/java/in/shraddha/ai/operator/**"
      - ".github/workflows/live-operator-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-operator-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Operator Android compile, unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Android unit tests and compile app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: live-app-operator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 10
