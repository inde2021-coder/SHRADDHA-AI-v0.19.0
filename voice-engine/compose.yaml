services:
  shraddha-voice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shraddha-custom-voice
    restart: unless-stopped
    ports:
      # Local-only by default. Publish through a trusted HTTPS reverse proxy for remote relay access.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      SHRADDHA_MODEL_HI: /models/shraddha-hi.onnx
      SHRADDHA_MODEL_EN: /models/shraddha-en.onnx
    volumes:
      - ./models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
